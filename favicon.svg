<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#brandGrad)" stroke-width="8" opacity="0.6" filter="url(#glow)" />
  
  <!-- AK Logo Symbol -->
  <g transform="translate(106, 146)">
    <!-- Letter A -->
    <path d="M 0 220 L 70 0 L 115 0 L 185 220 L 135 220 L 118 160 L 67 160 L 50 220 Z M 79 120 L 106 120 L 92.5 70 Z" fill="url(#brandGrad)" />
    <!-- Letter K -->
    <path d="M 195 0 L 245 0 L 245 85 L 295 0 L 350 0 L 285 100 L 355 220 L 300 220 L 245 120 L 245 220 L 195 220 Z" fill="url(#brandGrad)" />
  </g>
</svg>
